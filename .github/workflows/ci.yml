name: CI

on:
  push:
    branches: [main, "ws/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Golden sets run from recorded fixtures. A model-path case with no committed recording
      # counts as a failure here (EVAL_REQUIRE_RECORDINGS), so the gate cannot pass on pending cases.
      # WS15 adds score thresholds for the other sets.
      - name: Evals
        run: pnpm eval
        env:
          EVAL_REQUIRE_RECORDINGS: "1"

      # pnpm typecheck does not cover supabase/functions (Deno). Check every function's entry
      # point with its own deno.json, if it has one. No lockfile: versions are pinned in deno.json.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Edge Functions (deno check)
        run: |
          for entry in supabase/functions/*/index.ts; do
            dir="$(dirname "$entry")"
            echo "deno check $entry"
            if [ -f "$dir/deno.json" ]; then
              deno check --no-lock --config "$dir/deno.json" "$entry"
            else
              deno check --no-lock "$entry"
            fi
          done

  # The local Supabase stack needs a container runtime, which the development Mac does not
  # have (WS00 amendment, 2026-10-29). These checks run here instead.
  supabase:
    name: Supabase stack (migrations, health, worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # Also installs the pinned Supabase CLI (`supabase` devDependency), run as `pnpm supabase`.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Postgres, the API gateway, and the Edge runtime, plus what the identity tests (WS01)
      # need: gotrue (the auth schema and auth.uid()), postgrest (the API roles the policies
      # are written for), storage-api (the storage schema behind the avatars policies), and
      # mailpit (the magic link check below reads the email back from it).
      - name: Start Supabase
        run: >-
          pnpm supabase start
          -x realtime,imgproxy,postgres-meta,studio,logflare,vector,supavisor

      - name: Reset database from migrations
        run: pnpm supabase db reset

      - name: Database URL
        run: |
          db_url="$(pnpm --silent supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          test -n "$db_url"
          echo "DB_URL=$db_url" >> "$GITHUB_ENV"

      # WS03 criterion 1: the reset applied the ingredients migration and loaded the seed
      # (supabase/seed/10_ingredients.sql). Minimums from the brief, so a seed edit elsewhere
      # does not break CI.
      - name: Ontology seed is loaded
        run: |
          psql "$DB_URL" -c "select count(*) from public.ingredients" -c "select count(*) from public.ingredient_aliases"
          ingredients="$(psql "$DB_URL" -Atc "select count(*) from public.ingredients")"
          aliases="$(psql "$DB_URL" -Atc "select count(*) from public.ingredient_aliases")"
          echo "ingredients=$ingredients aliases=$aliases"
          test "$ingredients" -ge 600 || { echo "expected at least 600 ingredients"; exit 1; }
          test "$aliases" -ge 1200 || { echo "expected at least 1200 aliases"; exit 1; }

      # Criterion 9 (CI part)
      - name: Extensions are installed
        run: |
          psql "$DB_URL" -c "select extname from pg_extension order by 1" | tee extensions.txt
          for ext in pgmq pg_cron vector pg_trgm pgtap; do
            grep -qw "$ext" extensions.txt || { echo "missing extension: $ext"; exit 1; }
          done

      # Lint our own schemas only. The `extensions` schema holds third-party functions
      # (pgTAP) that plpgsql_check flags; add schemas here as migrations create them.
      # WS01 creates none: its tables and functions are all in `public`.
      - name: Lint schema
        run: pnpm supabase db lint --local --schema public --fail-on error

      # Every pgTAP file in supabase/tests runs here, once: WS01's RLS isolation, invite, and
      # avatars tests (001_rls_identity.sql), WS03's ingredient policies, and the waitlist
      # policies. Every later workstream adds its own file under supabase/tests.
      - name: Database tests (pgTAP)
        run: pnpm supabase test db

      # WS01 criterion 4. Request a magic link the way the app does (PKCE, redirect to the
      # mealplanner:// scheme), read the email back from Mailpit, open the link, and exchange the
      # code it redirects with for a session. Proves the template, the redirect allow list, and
      # that a profile is created for the new user. No secrets are printed.
      - name: Magic link signs a user in (Mailpit)
        run: |
          set -euo pipefail
          api=http://127.0.0.1:54321
          mail=http://127.0.0.1:54324
          anon="$(pnpm --silent supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')"
          test -n "$anon"
          email="ci-magic-$(date +%s)@example.test"
          verifier="$(openssl rand -hex 32)"
          challenge="$(printf '%s' "$verifier" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')"

          curl -sf -X POST "$api/auth/v1/otp?redirect_to=mealplanner://callback" \
            -H "apikey: $anon" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"create_user\":true,\"code_challenge\":\"$challenge\",\"code_challenge_method\":\"s256\"}" > /dev/null

          id=""
          for _ in $(seq 1 30); do
            id="$(curl -sf "$mail/api/v1/search?query=to:$email" | jq -r '.messages[0].ID // empty')"
            [ -n "$id" ] && break
            sleep 1
          done
          if [ -z "$id" ]; then echo "no email reached Mailpit for $email"; curl -s "$mail/api/v1/messages" | head -c 1500; exit 1; fi

          message="$(curl -sf "$mail/api/v1/message/$id")"
          echo "subject: $(echo "$message" | jq -r .Subject)"
          html="$(echo "$message" | jq -r .HTML)"
          echo "$html" | grep -q "Sign in to Meal Planner"
          link="$(echo "$html" | grep -oE 'href="[^"]*/auth/v1/verify[^"]*"' | head -1 | sed -e 's/^href="//' -e 's/"$//' -e 's/&amp;/\&/g')"
          test -n "$link"
          echo "$html" | grep -qE '<strong>[0-9]{6}</strong>'
          echo "the email carries a sign-in link and a 6 digit code"

          location="$(curl -s -o /dev/null -D - "$link" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')"
          case "$location" in
            mealplanner://callback\?code=*) echo "opening the link redirects to mealplanner://callback?code=<redacted>" ;;
            *) echo "unexpected redirect: ${location%%code=*}"; exit 1 ;;
          esac
          auth_code="${location#*code=}"; auth_code="${auth_code%%&*}"

          access="$(curl -sf -X POST "$api/auth/v1/token?grant_type=pkce" \
            -H "apikey: $anon" -H 'Content-Type: application/json' \
            -d "{\"auth_code\":\"$auth_code\",\"code_verifier\":\"$verifier\"}" | jq -r .access_token)"
          signed_in="$(curl -sf "$api/auth/v1/user" -H "apikey: $anon" -H "Authorization: Bearer $access" | jq -r .email)"
          test "$signed_in" = "$email"
          echo "the code exchanges for a session for $email"
          psql "$DB_URL" -tAc "select count(*) from public.profiles p join auth.users u on u.id = p.user_id where u.email = '$email'" | grep -qx 1
          echo "a profile row exists for the new user"

      # Criterion 10 (CI part)
      - name: Health function answers
        run: |
          pnpm supabase functions serve health > functions.log 2>&1 &
          body=""
          for _ in $(seq 1 60); do
            body="$(curl -s http://localhost:54321/functions/v1/health || true)"
            case "$body" in *'"ok":true'*) break ;; esac
            sleep 2
          done
          echo "$body"
          case "$body" in *'"ok":true'*) ;; *) cat functions.log; exit 1 ;; esac

      # The WS09 runs migration owns the real queue. Create it here only, so the worker
      # exercises pgmq.list_queues and pgmq.read instead of the queue-missing path.
      - name: Create the shopping_run queue (CI only)
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select pgmq.create('shopping_run')"

      # Criterion 11 (CI part)
      - name: Worker connects and polls
        env:
          WORKER_DATABASE_URL: ${{ env.DB_URL }}
        run: |
          timeout 15 pnpm --filter @mp/shopper-worker start > worker.log 2>&1 || true
          cat worker.log
          grep -q "\] connected " worker.log
          # `! grep` would not trip `set -e`, so fail explicitly.
          if grep -qE "poll failed|queue_missing" worker.log; then
            echo "worker did not read the real queue"; exit 1
          fi
          test "$(grep -c "\] idle " worker.log)" -ge 2

      # The committed packages/db/src/types.generated.ts must match the migrated schema. A new
      # migration that changes a table or function fails here until the regenerated file (the
      # artifact below, or `pnpm --filter @mp/db gen-types` on a stack) is committed. The upload
      # comes first so the fresh file is there to download when the check fails.
      - name: Generate database types
        run: pnpm --filter @mp/db gen-types

      - name: Upload generated types
        uses: actions/upload-artifact@v7
        with:
          name: types.generated.ts
          path: packages/db/src/types.generated.ts

      - name: Check committed types are current
        run: git diff --exit-code packages/db/src/types.generated.ts
