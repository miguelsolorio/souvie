name: Marketing site

# Build, test, and copy-check on every pull request that touches the site or what feeds it.
# On main, deploy apps/marketing to Cloudflare Pages (the host WS13 uses for the app).
# Setup the deploy needs is in apps/marketing/README.md (secrets and variables).

on:
  pull_request:
    paths:
      - "apps/marketing/**"
      - "packages/ui/**"
      - "docs/08-brand.md"
      - "supabase/migrations/*_waitlist.sql"
      - "supabase/tests/waitlist_rls.sql"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/marketing.yml"
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "packages/ui/**"
      - "docs/08-brand.md"
      - "supabase/migrations/*_waitlist.sql"
      - "supabase/tests/waitlist_rls.sql"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/marketing.yml"

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Public values: the anon key ships in the page by design. Set them as repository variables.
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_KEY }}
  MARKETING_SITE_URL: ${{ vars.MARKETING_SITE_URL }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Criteria 6 and 7: copy compliance and no retailer logos.
      - name: Copy check
        run: node apps/marketing/scripts/check-copy.mjs

      # Criterion 2: token and contrast tests live in packages/ui.
      - name: Unit tests
        run: |
          pnpm --filter @mp/ui test
          pnpm --filter @mp/marketing test

      - name: Typecheck
        run: pnpm --filter @mp/marketing typecheck

      # Criterion 3
      - name: Build
        run: pnpm --filter @mp/marketing build

      - name: Check the six sections
        run: node apps/marketing/tests/sections.test.mjs

  # Criterion 5. Needs the Supabase stack, which needs a container runtime, so it runs here and
  # not on the development Mac (docs/status.md, 2026-10-29). Same service list as ci.yml.
  waitlist-rls:
    name: Waitlist RLS (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase
        run: >-
          pnpm supabase start
          -x gotrue,realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,logflare,vector,supavisor

      - name: Reset database from migrations
        run: pnpm supabase db reset

      - name: Run pgTAP tests
        run: pnpm supabase test db

  deploy-marketing:
    name: Deploy to Cloudflare Pages
    needs: build
    # Only on main, and only once the Pages project exists (a repository variable). Until then
    # the job is skipped and main stays green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_PAGES_PROJECT_MARKETING != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @mp/marketing build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PAGES_PROJECT_MARKETING }}
        run: >-
          pnpm dlx wrangler@4.156.0 pages deploy apps/marketing/dist
          --project-name "$CF_PROJECT" --branch main --commit-message "marketing ${GITHUB_SHA::7}"
