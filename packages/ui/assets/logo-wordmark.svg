<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 64" width="132" height="64" role="img" aria-labelledby="title">
  <title id="title">Souvie</title>
  <!-- The name is the text inside <text id="wordmark"> and the <title> above. Change both to
       rename it, then size the viewBox to the new name (see "Wordmark fit" in
       packages/ui/README.md). The text is live, so the font is the reader's, and the box has to
       leave room for the widest serif the stack can fall back to. At this size "Souvie" is about
       99 units wide in Charter, 113 in Georgia, and 122 in DejaVu Serif Bold (the generic serif on
       many Linux systems). The text starts at x=2 and the box is 132 wide. -->
  <style>
    .word { fill: #1A1814; }
    @media (prefers-color-scheme: dark) { .word { fill: #FAF8F5; } }
  </style>
  <text id="wordmark" class="word" x="2" y="43" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, 'Iowan Old Style', Georgia, serif" font-size="34" font-weight="700" letter-spacing="-0.6">Souvie</text>
</svg>
