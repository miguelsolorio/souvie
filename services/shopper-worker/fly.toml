# Fly.io config for the shopper worker (WS09). A worker, not a web service: no ports, no health
# check over HTTP. Deploy from the repo root so the Docker context holds the workspace:
#
#   fly deploy . --config services/shopper-worker/fly.toml --dockerfile services/shopper-worker/Dockerfile \
#     --build-arg GIT_SHA="$(git rev-parse HEAD)"
#
# GIT_SHA is the Sentry release (WS15). SENTRY_DSN and POSTHOG_API_KEY are secrets; without them
# Sentry and PostHog stay off.
#
# Secrets (never in this file):
#   fly secrets set --config services/shopper-worker/fly.toml \
#     WORKER_DATABASE_URL=... ANTHROPIC_API_KEY=... KROGER_CLIENT_ID=... KROGER_CLIENT_SECRET=... \
#     EXPO_PUSH_ACCESS_TOKEN=...
app = "souvie-shopper-worker"
primary_region = "sea"

# The worker hands in-flight runs back to the queue and exits within 10 seconds of SIGTERM.
kill_signal = "SIGTERM"
kill_timeout = "10s"

[env]
  NODE_ENV = "production"
  WORKER_CONCURRENCY = "2"
  WORKER_HEARTBEAT_SECONDS = "30"
  WORKER_RETAILER_MODE = "live"
  AI_DAILY_CAP_USD = "2"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
